# Builds the package when a release is published and uploads it to PyPI.
#
# The build job has no credentials. The publish job runs in the `pypi` GitHub
# environment (#161438). It is the only job that can publish only after the
# switch to Trusted Publishing and the removal of PYPI_API_TOKEN: until then the
# token is a repository secret that any workflow with write access can read.
# The "release commit is on main" check below guards against mistakes; the real
# controls are the `pypi` environment rules (tag pattern v*, required reviewer)
# and a tag ruleset on v*.
#
# Publishing mode is chosen by the repository variable PYPI_TRUSTED_PUBLISHING:
#   unset or not "true": legacy, uploads with the PYPI_API_TOKEN secret (as before).
#   "true": PyPI Trusted Publishing (OIDC), no token. Switch on only after the
#           trusted publisher exists on PyPI (see the PR description).

name: Upload Python Package

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Check out the release tag
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Only publish commits that are on main
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        git fetch --no-tags origin "$DEFAULT_BRANCH"
        if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
          echo "::error::The release commit is not on $DEFAULT_BRANCH; refusing to publish."
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Keep the built files
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/ottu-py/
    permissions:
      id-token: write  # Trusted Publishing only; never used in legacy mode
    steps:
    - name: Get the built files
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/

    - name: Publish package (trusted publishing)
      if: ${{ vars.PYPI_TRUSTED_PUBLISHING == 'true' }}
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        verbose: true

    - name: Publish package (legacy token, remove after the switch)
      if: ${{ vars.PYPI_TRUSTED_PUBLISHING != 'true' }}
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        verbose: true
